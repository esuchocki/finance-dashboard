<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // Redirect to the main app with the requested path encoded as a query parameter
      // so React Router can pick it up on load
      var path = window.location.pathname.replace('/finance-dashboard', '');
      window.location.replace(
        '/finance-dashboard/?p=' + encodeURIComponent(path + window.location.search) + window.location.hash
      );
    </script>
  </head>
  <body></body>
</html>
